name: release

# Push a tag like v0.2.0 to build the Windows installer and the macOS disk images and attach them to a GitHub
# Release (created as a draft, so you can read it over before publishing). "Run workflow" builds without releasing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: version
        shell: bash
        run: echo "VERSION=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")" >> $GITHUB_ENV
      - name: install
        run: python -m pip install -e ".[gui,dev]"
      - name: bundled tools (flac, LGPL ffmpeg)
        run: powershell -ExecutionPolicy Bypass -File packaging\tools\fetch_windows.ps1
      - name: build app
        run: pyinstaller packaging/iaflac-gui.spec --noconfirm
      - name: smoke test the built app
        shell: bash
        run: |
          ./dist/iaflac/iaflac.exe --server-only --url-file url.txt &
          for i in $(seq 1 60); do [ -s url.txt ] && break; sleep 1; done
          URL=$(tr -d '\r\n' < url.txt); TOKEN=${URL##*token=}; BASE=${URL%%/?token*}
          curl -sf -H "x-iaflac-token: $TOKEN" "$BASE/api/health" | tee health.json
          grep -q '_internal' health.json
          taskkill //F //IM iaflac.exe || true
      - name: installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\iscc.exe" /DAppVersion=${{ env.VERSION }} packaging\windows\iaflac.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/iaflac-*-setup.exe

  macos:
    strategy:
      matrix:
        runner: [macos-15, macos-15-intel]          # Apple Silicon and Intel builds
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: version
        run: echo "VERSION=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")" >> $GITHUB_ENV
      - name: install
        run: python -m pip install -e ".[gui,dev]"
      - name: bundled tools (flac, LGPL ffmpeg built from source)
        run: bash packaging/tools/build_macos.sh
      - name: build app
        run: pyinstaller packaging/iaflac-gui.spec --noconfirm
      - name: smoke test the built app
        run: |
          ./dist/iaflac.app/Contents/MacOS/iaflac --server-only --url-file url.txt &
          for i in $(seq 1 60); do [ -s url.txt ] && break; sleep 1; done
          URL=$(tr -d '\r\n' < url.txt); TOKEN=${URL##*token=}; BASE=${URL%%/?token*}
          curl -sf -H "x-iaflac-token: $TOKEN" "$BASE/api/health" | tee health.json
          grep -q 'iaflac.app' health.json
          pkill -f iaflac.app || true
      - name: disk image
        run: bash packaging/macos/make_dmg.sh "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.runner }}
          path: dist/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: artifacts/*
          body: |
            Unsigned builds. First launch:
            - **Windows:** if SmartScreen says "Windows protected your PC", choose More info → Run anyway.
            - **macOS:** right-click iaflac in Applications → Open → Open (once). `-arm64` is for Apple Silicon, `-x86_64` for Intel Macs.

            Bundled tools: FLAC (BSD-style licence, Xiph.Org) and FFmpeg built under the LGPL; their sources and licences are listed in `bin/SOURCES.txt` inside the app.
