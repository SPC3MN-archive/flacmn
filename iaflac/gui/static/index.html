<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>flacmn</title>
<link rel="stylesheet" href="/static/app.css">
<script type="importmap">{ "imports": { "three": "/static/vendor/three/three.module.min.js" } }</script>
</head>
<body>
<div class="splash" id="splash" role="status" aria-label="flacmn is starting">
  <!-- spcmn's wordmark as ferrofluid: a 60 fps video (splash.mp4), added by splash.js; the poster until it plays -->
  <img src="/static/splash-poster.png" alt="" aria-hidden="true">
</div>
<script src="/static/js/splash.js"></script>
<header class="topbar">
  <img class="logo" src="/static/logo.svg" alt="flacmn">
  <nav class="row" id="tabs">
    <button class="tab active" data-view="search"><span data-icon="search"></span>Album Search</button>
    <button class="tab" data-view="cdart"><span data-icon="disc"></span>Case Art</button>
    <button class="tab" data-view="library"><span data-icon="library"></span>Library<span class="badge" id="lib-badge" hidden></span></button>
  </nav>
  <div class="spacer"></div>
  <button class="queue-chip" id="queue-chip" title="Downloads and background work"><span class="dot"></span><span id="queue-text">Queue · empty</span></button>
  <button class="icon-btn-dark" id="settings-btn" data-view="settings" title="Settings"><span data-icon="sliders"></span></button>
</header>

<main>
  <section class="view active" id="view-search"></section>
  <section class="view" id="view-cdart"></section>
  <section class="view" id="view-library"></section>
  <section class="view" id="view-settings"></section>
</main>

<div class="popover" id="queue-pop" hidden></div>
<div class="toasts" id="toasts"></div>
<audio id="player" preload="none"></audio>

<!-- the app (js/main.js) is started by splash.js, once the launch video is playing -->
</body>
</html>
