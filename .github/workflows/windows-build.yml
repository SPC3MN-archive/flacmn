name: windows build

# Builds the Windows installer for the source on this branch (flacmn 0.1.8, from spcmn-studio/spcmn apps/flacmn at
# 24672cf) and keeps it as a workflow artifact; it is attached to the v0.1.8 release by hand. Nothing is released here.
on:
  push:
    branches: [v0.1.8-source]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: version
        shell: bash
        run: echo "VERSION=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")" >> $GITHUB_ENV
      - name: install
        run: python -m pip install -e ".[gui,dev]"
      - name: bundled tools (flac, LGPL ffmpeg)
        run: powershell -ExecutionPolicy Bypass -File packaging\tools\fetch_windows.ps1
      - name: build app
        run: pyinstaller packaging/iaflac-gui.spec --noconfirm
      - name: smoke test the built app, started like a double-click (no console, no stdout or stderr)
        shell: pwsh
        run: |
          Start-Process -FilePath "dist\flacmn\flacmn.exe" -ArgumentList "--server-only", "--url-file", "$PWD\url.txt"
          $i = 0
          while ($i -lt 60 -and -not ((Test-Path url.txt) -and ((Get-Item url.txt).Length -gt 0))) { Start-Sleep 1; $i++ }
          $url = (Get-Content url.txt -Raw).Trim()
          $token = $url.Substring($url.IndexOf("token=") + 6); $base = $url.Substring(0, $url.IndexOf("/?token"))
          $health = (Invoke-WebRequest -UseBasicParsing -Headers @{ "x-iaflac-token" = $token } "$base/api/health").Content
          $health
          if ($health -notmatch "_internal") { throw "the app is not using its bundled tools" }
          $page = (Invoke-WebRequest -UseBasicParsing "$base/?token=$token").Content
          if ($page -notmatch "flacmn") { throw "the page did not load" }
          Stop-Process -Name flacmn -Force -ErrorAction SilentlyContinue
      - name: Inno Setup
        shell: pwsh
        run: if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\iscc.exe")) { choco install innosetup -y --no-progress }
      - name: installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\iscc.exe" /DAppVersion=${{ env.VERSION }} packaging\windows\iaflac.iss'
      - name: install it silently and start the installed copy
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\flacmn-*-setup.exe | Select-Object -First 1
          Start-Process -Wait -FilePath $setup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$env:RUNNER_TEMP\flacmn"
          Remove-Item url.txt -ErrorAction SilentlyContinue
          Start-Process -FilePath "$env:RUNNER_TEMP\flacmn\flacmn.exe" -ArgumentList "--server-only", "--url-file", "$PWD\url.txt"
          $i = 0
          while ($i -lt 60 -and -not ((Test-Path url.txt) -and ((Get-Item url.txt).Length -gt 0))) { Start-Sleep 1; $i++ }
          if (-not (Test-Path url.txt)) { throw "the installed app did not start" }
          Get-Content url.txt
          Stop-Process -Name flacmn -Force -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/flacmn-*-setup.exe
