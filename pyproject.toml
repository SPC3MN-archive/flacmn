[project]
name = "iaflac"
version = "0.1.0"
description = "Find and verify FLAC (ideally CD-rip) albums on the Internet Archive"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests", "numpy", "scipy", "matplotlib", "PyYAML", "openpyxl", "mutagen", "platformdirs", "Pillow"]

[project.scripts]
iaflac = "iaflac.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["iaflac*"]
