<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iaflac</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="topbar">
  <nav class="row" id="tabs">
    <button class="tab active" data-view="search"><span data-icon="search"></span>Album Search</button>
    <button class="tab" data-view="cdart"><span data-icon="disc"></span>CD Art</button>
    <button class="tab" data-view="library"><span data-icon="library"></span>Library<span class="badge" id="lib-badge" hidden></span></button>
  </nav>
  <div class="spacer"></div>
  <button class="queue-chip" id="queue-chip" title="Downloads and background work"><span class="dot"></span><span id="queue-text">Queue · empty</span></button>
  <button class="icon-btn-dark" id="settings-btn" data-view="settings" title="Settings"><span data-icon="sliders"></span></button>
</header>

<main>
  <section class="view active" id="view-search"></section>
  <section class="view" id="view-cdart"></section>
  <section class="view" id="view-library"></section>
  <section class="view" id="view-settings"></section>
</main>

<div class="popover" id="queue-pop" hidden></div>
<div class="toasts" id="toasts"></div>
<audio id="player" preload="none"></audio>

<script type="module" src="/static/js/main.js"></script>
</body>
</html>
