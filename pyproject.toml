[project]
name = "iaflac"
version = "0.1.0"
description = "Find and verify FLAC (ideally CD-rip) albums on the Internet Archive"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests", "numpy", "scipy", "matplotlib", "PyYAML", "openpyxl", "mutagen", "platformdirs", "Pillow", "reportlab"]

[project.optional-dependencies]
gui = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pywebview>=5"]
dev = ["httpx", "pyinstaller>=6", "pypdf"]

[project.scripts]
iaflac = "iaflac.cli:main"

[project.gui-scripts]
iaflac-gui = "iaflac.gui.app:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["iaflac*"]

[tool.setuptools.package-data]
"iaflac.gui" = ["static/**/*"]
