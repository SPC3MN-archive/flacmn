<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>flacmn</title>
<link rel="stylesheet" href="/static/app.css">
<script type="importmap">{ "imports": { "three": "/static/vendor/three/three.module.min.js" } }</script>
</head>
<body>
<div class="splash" id="splash" role="status" aria-label="flacmn is starting">
  <!-- spcmn's wordmark as ferrofluid: a 60 fps video (splash.mp4), added by splash.js; the poster until it plays -->
  <img src="/static/splash-poster.png" alt="" aria-hidden="true">
</div>
<script src="/static/js/splash.js"></script>
<header class="topbar">
  <img class="logo" src="/static/logo.svg" alt="flacmn">
  <nav class="row" id="tabs" aria-label="Main">
    <button class="tab active" data-view="albums">Albums</button>
    <button class="tab" data-view="artists">Artists</button>
    <button class="tab" data-view="playlists">Playlists</button>
    <button class="tab" data-view="search">Album Search</button>
    <button class="tab" data-view="cdart">Case Art</button>
  </nav>
  <!-- what is playing, from the library or an Album Search preview: the album and its progress (topbar.js) -->
  <div class="np-mini" id="np-mini" hidden></div>
  <button class="queue-chip" id="queue-chip" title="Downloads and background work"><span class="dot"></span><span id="queue-text">Downloads</span></button>
  <button class="icon-btn-dark" id="settings-btn" data-view="settings" title="Settings" aria-label="Settings"><span data-icon="sliders"></span></button>
</header>

<main>
  <section class="view active" id="view-albums" aria-label="Albums"></section>
  <section class="view" id="view-artists" aria-label="Artists"></section>
  <section class="view" id="view-playlists" aria-label="Playlists"></section>
  <section class="view" id="view-search" aria-label="Album Search"></section>
  <section class="view" id="view-cdart" aria-label="Case Art"></section>
  <section class="view" id="view-settings" aria-label="Settings"></section>
</main>

<div class="popover" id="queue-pop" hidden></div>
<div class="popover np-pop" id="np-pop" hidden></div>
<div class="toasts" id="toasts"></div>
<audio id="player" preload="none"></audio>

<!-- the app (js/main.js) is started by splash.js, once the launch video is playing -->
</body>
</html>
